# Angara M01 — минимальная безопасная конфигурация.
# `angara check` только проверяет этот файл; `angara serve` связывает listener
# и запускает HTTP/1.1 proxy (M03). Без [access] правила запросов закрыты.

schema_version = 1

[runtime]
# "auto" использует доступный процессу параллелизм (минимум 1, максимум 64)
# либо укажите целое число от 1 до 64.
worker_threads = "auto"

[limits]
max_connections = 256
max_header_bytes = 32768
header_read_timeout_ms = 10000
idle_timeout_ms = 60000
shutdown_timeout_ms = 10000

[[listeners]]
id = "proxy-loopback"
bind = "127.0.0.1:3128"
transport = "http"
