# Angara M02 — пример политики исходящего доступа.
# Проверяется `angara check`; DNS и сокеты не открываются.

schema_version = 1

[runtime]
worker_threads = "auto"

[limits]
max_connections = 256
max_header_bytes = 32768
header_read_timeout_ms = 10000
idle_timeout_ms = 60000
shutdown_timeout_ms = 10000

[[listeners]]
id = "proxy-loopback"
bind = "127.0.0.1:3128"
transport = "http"

[access]
source_allow = ["127.0.0.0/8", "::1/128"]
ip_default = "public_only"

[[access.rules]]
id = "deny-example-admin"
action = "deny"
host_exact = ["admin.example.com"]

[[access.rules]]
id = "allow-example-http"
action = "allow"
methods = ["GET", "HEAD"]
ports = [80]
host_suffix = ["example.com"]

[[access.rules]]
id = "allow-example-connect"
action = "allow"
methods = ["CONNECT"]
ports = [443]
host_suffix = ["example.com"]

[dns]
timeout_ms = 3000
max_in_flight = 4
max_answers = 16

[transport]
total_timeout_ms = 10000
connect_timeout_ms = 3000
max_connect_attempts = 3
max_connecting = 32

[[egress]]
id = "system"
mode = "system"

[routing]
default_egress = "system"
