# Angara M08 — complete HTTP+HTTPS/Basic/ACL example for Ubuntu Server 24.04.
#
# Copy this file as /etc/angara/angara.toml, then create users.local.toml and
# tls/proxy-chain.pem + tls/proxy-key.pem next to it as described in
# docs/ADMIN_GUIDE.md. The initial listeners are loopback-only; replace the
# bind addresses and ACL deliberately for a real network.
#
# This is a complete standalone document, not a fragment to append to another
# config. `angara check --config /etc/angara/angara.toml` validates it.

schema_version = 1

[runtime]
worker_threads = 2

[limits]
max_connections = 256
max_client_connections = 128
max_header_bytes = 32768
header_read_timeout_ms = 10000
idle_timeout_ms = 60000
shutdown_timeout_ms = 5000

[operations]
reload_timeout_ms = 5000

[observability]
log_level = "info"
log_queue_capacity = 1024
metrics_enabled = true
metrics_interval_ms = 30000

[auth]
users_file = "users.local.toml"
max_verifying = 2
verify_timeout_ms = 2000

[tls]
max_handshaking = 32
handshake_timeout_ms = 5000

[[listeners]]
id = "proxy-http"
bind = "127.0.0.1:3128"
transport = "http"
auth = "none"

[[listeners]]
id = "proxy-https"
bind = "127.0.0.1:3129"
transport = "https"
auth = "basic"

[listeners.tls]
cert_chain_file = "tls/proxy-chain.pem"
private_key_file = "tls/proxy-key.pem"

[access]
source_allow = ["127.0.0.0/8", "::1/128"]
ip_default = "deny"

[[access.rules]]
id = "http-local"
action = "allow"
listeners = ["proxy-http"]
methods = ["GET", "HEAD", "POST"]
ports = [18080]

[[access.rules]]
id = "https-alice"
action = "allow"
listeners = ["proxy-https"]
users = ["alice"]
methods = ["GET", "HEAD", "POST", "CONNECT"]
ports = [18080, 18443]

[[access.ip_rules]]
id = "allow-loopback-target"
action = "allow"
networks = ["127.0.0.0/8", "::1/128"]
allow_special = true

[dns]
timeout_ms = 3000
max_in_flight = 4
max_answers = 16

[transport]
total_timeout_ms = 10000
connect_timeout_ms = 3000
max_connect_attempts = 3
max_connecting = 32

[http]
max_headers = 100
response_header_timeout_ms = 30000
pool_max_idle = 16
pool_max_idle_per_key = 2
pool_idle_timeout_ms = 15000

[connect]
allowed_ports = [18443]
half_close_timeout_ms = 5000

[[egress]]
id = "system"
mode = "system"

[routing]
default_egress = "system"
