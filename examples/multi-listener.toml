# Angara M01 — пример нескольких listeners.
#
# IPv6 listener в M01 проектируется как IPv6-only: будущий bind должен
# выставлять IPV6_V6ONLY. Поэтому 0.0.0.0 и [::] на одном порту не считаются
# конфликтом, а конкретные адреса одного семейства на одном порту допустимы.
# Этот файл проверяется `angara check`; сеть не открывается.

schema_version = 1

[runtime]
worker_threads = 4

[limits]
max_connections = 1024
max_header_bytes = 32768
header_read_timeout_ms = 10000
idle_timeout_ms = 120000
shutdown_timeout_ms = 15000

[[listeners]]
id = "proxy-v4-loopback"
bind = "127.0.0.1:3128"
transport = "http"

[[listeners]]
id = "proxy-v6-loopback"
bind = "[::1]:3128"
transport = "http"

# Конкретные адреса одного семейства на одном порту не пересекаются.
[[listeners]]
id = "proxy-v4-admin-net"
bind = "127.0.0.2:3128"
transport = "http"
