# Angara M10 — локальный HTTP proxy с ограниченным RAM-кешем.
# Пример проверяется `angara check`; `serve` слушает 127.0.0.1:3128.
# Кеш применяется при запуске: изменение [cache] требует restart.

schema_version = 1

[runtime]
worker_threads = 2

[limits]
max_connections = 256
max_client_connections = 128
max_header_bytes = 32768
header_read_timeout_ms = 10000
idle_timeout_ms = 60000
shutdown_timeout_ms = 10000

[[listeners]]
id = "proxy-loopback"
bind = "127.0.0.1:3128"
transport = "http"

[access]
source_allow = ["127.0.0.0/8"]
ip_default = "deny"

[[access.rules]]
id = "allow-local"
action = "allow"

[[access.ip_rules]]
id = "allow-loopback-target"
action = "allow"
networks = ["127.0.0.0/8"]
allow_special = true

[transport]
total_timeout_ms = 10000
connect_timeout_ms = 3000
max_connect_attempts = 3
max_connecting = 32

[http]
max_headers = 100
response_header_timeout_ms = 30000
pool_max_idle = 16
pool_max_idle_per_key = 2
pool_idle_timeout_ms = 15000

[[egress]]
id = "system"
mode = "system"

[routing]
default_egress = "system"

# Начальные лимиты пилота: 32 MiB, 1 MiB на объект, 512 записей,
# 8 одновременных наполнений. Кешируются только полные 200 на GET по direct.
[cache]
enabled = true
max_bytes = 33554432
max_object_bytes = 1048576
max_entries = 512
max_fills = 8
