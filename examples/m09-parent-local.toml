# M09: локальный HTTP parent proxy (например, отдельный Squid на 13128).
# Этот пример не требует credentials и проверяется offline через `angara check`.

schema_version = 1

[runtime]
worker_threads = "auto"

[limits]
max_connections = 256
max_header_bytes = 32768
header_read_timeout_ms = 10000
idle_timeout_ms = 60000
shutdown_timeout_ms = 10000

[[listeners]]
id = "loopback"
bind = "127.0.0.1:3128"
transport = "http"

[access]
source_allow = ["127.0.0.0/8"]
ip_default = "deny"

[[access.rules]]
id = "allow-loopback-clients"
action = "allow"

[[access.ip_rules]]
id = "allow-loopback-targets"
action = "allow"
networks = ["127.0.0.0/8"]
allow_special = true

# HTTP parent. Для HTTPS добавьте transport = "https" и ca_file,
# либо используйте системный trust bundle на Ubuntu.
[[parents]]
id = "squid"
endpoint = "127.0.0.1:13128"
transport = "http"

[routing]
default_egress = "system"
default_parent = "squid"

# Явный direct для локального тестового origin: default parent остаётся
# для остальных запросов.
[[routing.rules]]
id = "direct-local-origin"
egress_id = "system"
next_hop = "direct"
ports = [18080]
