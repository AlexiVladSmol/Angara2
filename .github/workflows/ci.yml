name: CI

on:
  push:
    branches:
      - main
      - docs/m00-proposal
      # Development branches get CI even before the workflow exists on the
      # base branch, for example when the workflow itself is introduced in a PR.
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust checks (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Locked build
        run: cargo build --locked

      - name: Tests (unit, integration, CLI, Linux network guard)
        run: cargo test --locked

      - name: Resource evidence (Linux fd/RSS baseline)
        run: |
          cargo test --locked --test http_limits \
            m03_res02 \
            -- --ignored --test-threads=1 --nocapture
          cargo test --locked --test m04_limits \
            m04_res02 \
            -- --ignored --test-threads=1 --nocapture

      - name: CPU evidence (multi-worker HTTP path)
        run: |
          cargo test --locked --test http_forward \
            m03_cpu01_angara_outbound_path_uses_multiple_workers \
            -- --nocapture
          cargo test --locked --test m04_connect \
            m04_cpu01_connect_path_uses_multiple_workers \
            -- --nocapture

      - name: M05 auth resource and memory evidence
        run: |
          cargo test --locked --test m05_limits \
            -- --nocapture --test-threads=1

      - name: M05 auth admission, CPU and PTY evidence
        run: |
          cargo test --locked --test m05_control m05_cpu01 \
            -- --nocapture
          cargo test --locked --test m05_control m05_cancel01 \
            -- --nocapture
          cargo test --locked --test m05_control m05_ops01_runtime \
            -- --nocapture
          cargo test --locked --test m05_auth cli_users_hash_pty \
            -- --nocapture

      - name: Validate example configurations
        run: |
          cargo run --locked -- check --config examples/minimal.toml
          cargo run --locked -- check --config examples/multi-listener.toml
          cargo run --locked -- check --config examples/m02-policy.toml
          cargo run --locked -- check --config examples/m02-egress-local.toml
          cargo run --locked -- check --config examples/m03-http-local.toml
          cargo run --locked -- check --config examples/m04-connect-local.toml

      - name: Validate M05 auth example with a generated users file
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          umask 077
          PHC=$(printf '%s\n' 'synthetic-ci-password' | \
            ./target/debug/angara users hash --password-stdin)
          {
            printf 'version = 1\n\n[[users]]\nusername = "alice"\n'
            printf 'password_hash = "%s"\ndisabled = false\n' "$PHC"
          } >"$TMP/users.toml"
          chmod 600 "$TMP/users.toml"
          sed 's|m05-users.local.toml|users.toml|' \
            examples/m05-auth-local.toml >"$TMP/proxy.toml"
          ./target/debug/angara check --config "$TMP/proxy.toml"

      - name: Validate M06 HTTPS example with generated PKI
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          umask 077
          python3 tests/fixtures/m06_pki.py --dir "$TMP/pki"
          mkdir -p "$TMP/tls"
          cp "$TMP/pki/proxy_chain.pem" "$TMP/tls/proxy-chain.pem"
          cp "$TMP/pki/proxy_key.pem" "$TMP/tls/proxy-key.pem"
          chmod 0600 "$TMP/tls/proxy-key.pem"
          PHC=$(printf '%s\n' 'synthetic-ci-password' | \
            ./target/debug/angara users hash --password-stdin)
          {
            printf 'version = 1\n\n[[users]]\nusername = "alice"\n'
            printf 'password_hash = "%s"\ndisabled = false\n' "$PHC"
          } >"$TMP/m06-users.local.toml"
          chmod 0600 "$TMP/m06-users.local.toml"
          cp examples/m06-https-local.toml "$TMP/m06.toml"
          ./target/debug/angara check --config "$TMP/m06.toml"

      - name: Validate M07 operations example with generated material
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          umask 077
          python3 tests/fixtures/m06_pki.py --dir "$TMP/pki"
          mkdir -p "$TMP/tls"
          cp "$TMP/pki/proxy_chain.pem" "$TMP/tls/proxy-chain.pem"
          cp "$TMP/pki/proxy_key.pem" "$TMP/tls/proxy-key.pem"
          chmod 0600 "$TMP/tls/proxy-key.pem"
          PHC=$(printf '%s\n' 'synthetic-ci-password' | \
            ./target/debug/angara users hash --password-stdin)
          {
            printf 'version = 1\n\n[[users]]\nusername = "alice"\n'
            printf 'password_hash = "%s"\ndisabled = false\n\n' "$PHC"
            printf '[[users]]\nusername = "bob"\n'
            printf 'password_hash = "%s"\ndisabled = false\n' "$PHC"
          } >"$TMP/users.local.toml"
          chmod 0600 "$TMP/users.local.toml"
          cp examples/m07-operations-local.toml "$TMP/m07.toml"
          ./target/debug/angara check --config "$TMP/m07.toml"

      - name: M07 reload, control and observability tests
        run: |
          cargo test --locked --test m07_reload -- --nocapture --test-threads=1
          cargo test --locked --test config_m07 -- --nocapture
          cargo test --locked --test cli_m07 -- --nocapture --test-threads=1
          cargo test --locked --test m07_limits -- --nocapture --test-threads=1

      - name: M04 forced-shutdown stability (20 repeats)
        run: |
          for attempt in $(seq 1 20); do
            cargo test --locked --test m04_server \
              m04_srv01_forced_shutdown_reclaims_active_tunnel_tasks \
              -- --nocapture
          done

      - name: M06 TLS resource, load and handshake evidence
        run: |
          cargo test --locked --test m06_limits \
            -- --nocapture --test-threads=1
          cargo test --locked --test m06_extra m06_cpu01 \
            -- --nocapture
          cargo test --locked --test m06_extra m06_time01 \
            -- --nocapture
          cargo test --locked --test m06_progress \
            -- --nocapture

      - name: M05 Basic curl smoke through the real proxy
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          ORIGIN_PID=""
          PROXY_PID=""
          cleanup() {
            if [ -n "$PROXY_PID" ]; then kill -TERM "$PROXY_PID" 2>/dev/null || true; fi
            if [ -n "$ORIGIN_PID" ]; then kill "$ORIGIN_PID" 2>/dev/null || true; fi
            rm -rf "$TMP"
          }
          trap cleanup EXIT
          umask 077
          python3 examples/m03-local-origin.py --port 18080 >"$TMP/origin.log" 2>&1 &
          ORIGIN_PID=$!
          PHC=$(printf '%s\n' 'synthetic-ci-password' | \
            ./target/debug/angara users hash --password-stdin)
          {
            printf 'version = 1\n\n[[users]]\nusername = "alice"\n'
            printf 'password_hash = "%s"\ndisabled = false\n' "$PHC"
          } >"$TMP/users.toml"
          chmod 600 "$TMP/users.toml"
          sed -e 's|m05-users.local.toml|users.toml|' \
            -e 's|ports = \[8080, 8443\]|ports = [18080, 8443]|' \
            examples/m05-auth-local.toml >"$TMP/proxy.toml"
          cat >"$TMP/good.conf" <<EOF
          proxy-user = "alice:synthetic-ci-password"
          silent
          show-error
          fail
          EOF
          cat >"$TMP/bad.conf" <<EOF
          proxy-user = "alice:wrong-password"
          silent
          show-error
          fail
          EOF
          chmod 600 "$TMP"/*.conf
          ./target/debug/angara serve --config "$TMP/proxy.toml" 2>"$TMP/proxy.log" &
          PROXY_PID=$!
          for _ in $(seq 1 100); do
            if curl --noproxy '' --proxy http://127.0.0.1:3128 \
              --config "$TMP/good.conf" \
              http://127.0.0.1:18080/ >"$TMP/good.txt" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          grep -q 'angara m03 local origin' "$TMP/good.txt"
          set +e
          NO_AUTH=$(curl --noproxy '' --proxy http://127.0.0.1:3128 \
            -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)
          NO_AUTH_CODE=$?
          BAD_AUTH=$(curl --noproxy '' --proxy http://127.0.0.1:3128 \
            --config "$TMP/bad.conf" -sS -o /dev/null \
            -w '%{http_code}' http://127.0.0.1:18080/)
          BAD_AUTH_CODE=$?
          set -e
          test "$NO_AUTH_CODE" -eq 0
          test "$BAD_AUTH_CODE" -eq 22
          test "$NO_AUTH" = "407"
          test "$BAD_AUTH" = "407"
          kill -TERM "$PROXY_PID"
          wait "$PROXY_PID"
          kill "$ORIGIN_PID"
          trap - EXIT
          rm -rf "$TMP"

      - name: M06 HTTPS proxy curl smoke with two CAs
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          PROXY_PID=""
          ORIGIN_PID=""
          SITE_PID=""
          cleanup() {
            if [ -n "$PROXY_PID" ]; then kill -TERM "$PROXY_PID" 2>/dev/null || true; fi
            if [ -n "$ORIGIN_PID" ]; then kill "$ORIGIN_PID" 2>/dev/null || true; fi
            if [ -n "$SITE_PID" ]; then kill "$SITE_PID" 2>/dev/null || true; fi
            rm -rf "$TMP"
          }
          trap cleanup EXIT
          umask 077
          python3 tests/fixtures/m06_pki.py --dir "$TMP/pki"
          echo "M06 stage: pki ready"
          mkdir -p "$TMP/site"
          python3 tests/fixtures/m04_tls_site.py --dir "$TMP/site" \
            >"$TMP/site-port.txt" 2>"$TMP/site.log" &
          SITE_PID=$!
          for _ in $(seq 1 100); do
            test -s "$TMP/site-port.txt" && break
            sleep 0.1
          done
          echo "M06 stage: site port bytes=$(wc -c <"$TMP/site-port.txt")"
          cat "$TMP/site.log"
          SITE_PORT=$(sed -n 's/^PORT=//p' "$TMP/site-port.txt")
          test -n "$SITE_PORT"
          echo "M06 stage: site port=$SITE_PORT"
          python3 examples/m03-local-origin.py --port 18080 \
            >"$TMP/origin.log" 2>&1 &
          ORIGIN_PID=$!
          PHC=$(printf '%s\n' 'synthetic-ci-password' | \
            ./target/debug/angara users hash --password-stdin)
          echo "M06 stage: users hash ready"
          {
            printf 'version = 1\n\n[[users]]\nusername = "alice"\n'
            printf 'password_hash = "%s"\ndisabled = false\n' "$PHC"
          } >"$TMP/m06-users.local.toml"
          chmod 0600 "$TMP/m06-users.local.toml"
          mkdir -p "$TMP/tls"
          cp "$TMP/pki/proxy_chain.pem" "$TMP/tls/proxy-chain.pem"
          cp "$TMP/pki/proxy_key.pem" "$TMP/tls/proxy-key.pem"
          chmod 0600 "$TMP/tls/proxy-key.pem"
          sed -e "s|ports = \[8080, 8443\]|ports = [18080, $SITE_PORT]|g" \
            -e "s|allowed_ports = \[8443\]|allowed_ports = [$SITE_PORT]|" \
            examples/m06-https-local.toml >"$TMP/m06.toml"
          echo "M06 stage: config ready"
          SSLKEYLOGFILE="$TMP/keylog.txt" \
            ./target/debug/angara serve --config "$TMP/m06.toml" \
            2>"$TMP/proxy.err" &
          PROXY_PID=$!
          echo "M06 stage: proxy started"
          READY=0
          for _ in $(seq 1 100); do
            if curl -fsS --noproxy '' --proxy https://localhost:3129 \
              --proxy-cacert "$TMP/pki/proxy_ca.pem" \
              --proxy-user "alice:synthetic-ci-password" \
              http://127.0.0.1:18080/ >"$TMP/http.txt" 2>/dev/null; then
              READY=1
              break
            fi
            sleep 0.1
          done
          if [ "$READY" -ne 1 ]; then
            echo "M06 proxy stderr:"
            cat "$TMP/proxy.err"
            echo "M06 proxy TLS preflight:"
            echo | openssl s_client -connect 127.0.0.1:3129 \
              -servername localhost -tls1_2 \
              -CAfile "$TMP/pki/proxy_ca.pem" -brief 2>&1 || true
            echo "M06 curl verbose:"
            curl -v --noproxy '' --proxy https://localhost:3129 \
              --proxy-cacert "$TMP/pki/proxy_ca.pem" \
              --proxy-user "alice:synthetic-ci-password" \
              http://127.0.0.1:18080/ >"$TMP/ready.out" 2>"$TMP/ready.err" || true
            tail -80 "$TMP/ready.err"
            cat "$TMP/ready.out"
            exit 1
          fi
          echo "M06 stage: http response bytes=$(wc -c <"$TMP/http.txt")"
          cat "$TMP/http.txt"
          grep -q 'angara m03 local origin' "$TMP/http.txt"
          echo "M06 stage: http 200 ok"
          set +e
          NO_AUTH=$(curl -sS -o /dev/null -w '%{http_code}' --noproxy '' \
            --proxy https://localhost:3129 \
            --proxy-cacert "$TMP/pki/proxy_ca.pem" \
            http://127.0.0.1:18080/)
          NO_AUTH_CODE=$?
          ACL_DENIED=$(curl -sS -o /dev/null -w '%{http_code}' --noproxy '' \
            --proxy https://localhost:3129 \
            --proxy-cacert "$TMP/pki/proxy_ca.pem" \
            --proxy-user "alice:synthetic-ci-password" \
            http://127.0.0.1:18081/)
          ACL_CODE=$?
          set -e
          echo "M06 stage: noauth=$NO_AUTH code=$NO_AUTH_CODE acl=$ACL_DENIED code=$ACL_CODE"
          test "$NO_AUTH_CODE" -eq 0
          test "$ACL_CODE" -eq 0
          test "$NO_AUTH" = "407"
          test "$ACL_DENIED" = "403"
          echo "M06 stage: auth checks ok"
          curl -fsS --noproxy '' --proxy https://localhost:3129 \
            --proxy-cacert "$TMP/pki/proxy_ca.pem" \
            --proxy-user "alice:synthetic-ci-password" \
            --cacert "$TMP/site/ca.pem" "https://localhost:$SITE_PORT/" \
            -o "$TMP/site.txt"
          grep -q 'tls-ok' "$TMP/site.txt"
          echo "M06 stage: layered CONNECT ok"
          head -c 1048576 /dev/urandom >"$TMP/upload.bin"
          curl -fsS --noproxy '' --proxy https://localhost:3129 \
            --proxy-cacert "$TMP/pki/proxy_ca.pem" \
            --proxy-user "alice:synthetic-ci-password" \
            --cacert "$TMP/site/ca.pem" \
            --data-binary @"$TMP/upload.bin" \
            "https://localhost:$SITE_PORT/upload" -o "$TMP/upload.txt"
          grep -q 'upload:1048576' "$TMP/upload.txt"
          echo "M06 stage: layered upload ok"
          curl -fsS --noproxy '' --proxy https://localhost:3129 \
            --proxy-cacert "$TMP/pki/proxy_ca.pem" \
            --proxy-user "alice:synthetic-ci-password" \
            --cacert "$TMP/site/ca.pem" \
            "https://localhost:$SITE_PORT/download" -o "$TMP/download.bin"
          test "$(wc -c <"$TMP/download.bin")" -eq 1048576
          echo "M06 stage: layered download ok"
          set +e
          curl -sS -o /dev/null --noproxy '' --proxy https://localhost:3129 \
            --proxy-cacert "$TMP/site/ca.pem" \
            --proxy-user "alice:synthetic-ci-password" \
            http://127.0.0.1:18080/ 2>"$TMP/proxy-ca.err"
          PROXY_CA_CODE=$?
          curl -sS -o /dev/null --noproxy '' --proxy https://127.0.0.1:3129 \
            --proxy-cacert "$TMP/pki/proxy_ca.pem" \
            --proxy-user "alice:synthetic-ci-password" \
            http://127.0.0.1:18080/ 2>"$TMP/proxy-name.err"
          PROXY_NAME_CODE=$?
          curl -sS -o /dev/null --noproxy '' --proxy https://localhost:3129 \
            --proxy-cacert "$TMP/pki/proxy_ca.pem" \
            --proxy-user "alice:synthetic-ci-password" \
            --cacert "$TMP/pki/proxy_ca.pem" \
            "https://localhost:$SITE_PORT/" 2>"$TMP/site-ca.err"
          SITE_CA_CODE=$?
          echo "M06 stage: negative codes proxy_ca=$PROXY_CA_CODE name=$PROXY_NAME_CODE site_ca=$SITE_CA_CODE"
          echo | openssl s_client -connect 127.0.0.1:3129 \
            -servername localhost -tls1 -cipher 'DEFAULT@SECLEVEL=0' \
            -CAfile "$TMP/pki/proxy_ca.pem" -quiet \
            >"$TMP/tls1.out" 2>"$TMP/tls1.err"
          TLS1_CODE=$?
          echo | openssl s_client -connect 127.0.0.1:3129 \
            -servername localhost -tls1_2 \
            -CAfile "$TMP/pki/proxy_ca.pem" \
            >"$TMP/tls12.out" 2>"$TMP/tls12.err"
          TLS12_CODE=$?
          echo "M06 stage: openssl tls1=$TLS1_CODE tls12=$TLS12_CODE"
          test ! -e "$TMP/keylog.txt"
          echo "M06 stage: keylog absent"
          set -e
          test "$PROXY_CA_CODE" -eq 60
          test "$PROXY_NAME_CODE" -eq 60
          if [ "$SITE_CA_CODE" -ne 60 ] && [ "$SITE_CA_CODE" -ne 35 ]; then
            echo "unexpected site CA exit: $SITE_CA_CODE"
            cat "$TMP/site-ca.err"
            exit 1
          fi
          grep -Eqi 'certificate|unknown ca|SSL' "$TMP/proxy-ca.err"
          grep -Eqi 'certificate|unknown ca|SSL' "$TMP/site-ca.err"
          grep -Eqi 'alert|protocol|version|handshake|no protocols|unsupported' \
            "$TMP/tls1.err" "$TMP/tls1.out"
          if grep -q 'Protocol *: TLSv1$' "$TMP/tls1.out"; then
            echo "TLS1 unexpectedly negotiated"
            exit 1
          fi
          grep -q 'Protocol *: TLSv1.2' "$TMP/tls12.out"
          echo "M06 stage: version checks ok"
          kill -TERM "$PROXY_PID"
          wait "$PROXY_PID"
          kill "$ORIGIN_PID" "$SITE_PID" 2>/dev/null || true
          trap - EXIT
          rm -rf "$TMP"

      - name: Curl smoke through the real proxy
        run: |
          set -euo pipefail
          python3 examples/m03-local-origin.py --port 18080 &
          ORIGIN_PID=$!
          ./target/debug/angara serve --config examples/m03-http-local.toml 2>proxy.log &
          PROXY_PID=$!
          cleanup() {
            kill -TERM "$PROXY_PID" 2>/dev/null || true
            kill "$ORIGIN_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do
            if curl -fsS --noproxy '' --proxy http://127.0.0.1:3128 \
              http://127.0.0.1:18080/ >/tmp/angara-root.txt 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          grep -q 'angara m03 local origin' /tmp/angara-root.txt
          curl -fsS --noproxy '' --proxy http://127.0.0.1:3128 \
            -I http://127.0.0.1:18080/binary -o /tmp/angara-head.txt
          grep -q '200' /tmp/angara-head.txt
          head -c 65536 /dev/urandom >/tmp/angara-upload.bin
          curl -fsS --noproxy '' --proxy http://127.0.0.1:3128 \
            --data-binary @/tmp/angara-upload.bin http://127.0.0.1:18080/echo \
            -o /tmp/angara-echo.txt
          grep -q 'received 65536 bytes' /tmp/angara-echo.txt
          curl -fsS --noproxy '' --proxy http://127.0.0.1:3128 \
            -H 'Transfer-Encoding: chunked' \
            --data-binary @/tmp/angara-upload.bin http://127.0.0.1:18080/echo \
            -o /tmp/angara-chunked-echo.txt
          grep -q 'received 65536 bytes' /tmp/angara-chunked-echo.txt
          curl -fsS --noproxy '' --proxy http://127.0.0.1:3128 \
            -H 'Range: bytes=0-15' http://127.0.0.1:18080/range \
            -o /tmp/angara-range.bin
          test "$(wc -c </tmp/angara-range.bin)" -eq 16
          curl -fsS --noproxy '' --proxy http://127.0.0.1:3128 -N \
            http://127.0.0.1:18080/sse -o /tmp/angara-sse.txt
          grep -q 'data: event 7' /tmp/angara-sse.txt
          kill -TERM "$PROXY_PID"
          wait "$PROXY_PID"
          kill "$ORIGIN_PID"
          trap - EXIT

      - name: TLS curl smoke through the real proxy
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          PROXY_PID=""
          python3 tests/fixtures/m04_tls_site.py --dir "$TMP" \
            >"$TMP/port.txt" 2>"$TMP/site.log" &
          SITE_PID=$!
          cleanup() {
            if [ -n "$PROXY_PID" ]; then kill -TERM "$PROXY_PID" 2>/dev/null || true; fi
            kill "$SITE_PID" 2>/dev/null || true
            rm -rf "$TMP"
          }
          for _ in $(seq 1 100); do
            test -s "$TMP/port.txt" && break
            sleep 0.1
          done
          PORT=$(sed -n 's/^PORT=//p' "$TMP/port.txt")
          test -n "$PORT"
          sed "s/allowed_ports = \[443, 8443\]/allowed_ports = [$PORT]/" \
            examples/m04-connect-local.toml >"$TMP/m04.toml"
          ./target/debug/angara serve --config "$TMP/m04.toml" 2>"$TMP/proxy.log" &
          PROXY_PID=$!
          trap cleanup EXIT
          for _ in $(seq 1 100); do
            if curl -fsS --noproxy '' --proxy http://127.0.0.1:3128 \
              --cacert "$TMP/ca.pem" "https://localhost:$PORT/" \
              -o "$TMP/tls.txt" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          grep -q 'tls-ok' "$TMP/tls.txt"
          head -c 1048576 /dev/urandom >"$TMP/upload.bin"
          curl -fsS --noproxy '' --proxy http://127.0.0.1:3128 \
            --cacert "$TMP/ca.pem" \
            --data-binary @"$TMP/upload.bin" "https://localhost:$PORT/upload" \
            -o "$TMP/upload.txt"
          test "$(cat "$TMP/upload.txt")" = \
            "upload:1048576:$(sha256sum "$TMP/upload.bin" | cut -d' ' -f1)"
          curl -fsS --noproxy '' --proxy http://127.0.0.1:3128 \
            --cacert "$TMP/ca.pem" "https://localhost:$PORT/download" \
            -o "$TMP/download.bin"
          test "$(wc -c <"$TMP/download.bin")" -eq 1048576
          EXPECTED=$(python3 -c 'import hashlib; print(hashlib.sha256(bytes((i * 17) % 251 for i in range(1024 * 1024))).hexdigest())')
          test "$(sha256sum "$TMP/download.bin" | cut -d' ' -f1)" = "$EXPECTED"
          set +e
          curl -fsS --noproxy '' --proxy http://127.0.0.1:3128 \
            --cacert "$TMP/ca.pem" "https://127.0.0.1:$PORT/" \
            -o /dev/null 2>"$TMP/negative.err"
          NEGATIVE_CODE=$?
          set -e
          test "$NEGATIVE_CODE" -eq 60
          grep -Eqi 'certificate|subject|altname|SSL' "$TMP/negative.err"
          kill -TERM "$PROXY_PID"
          wait "$PROXY_PID"
          kill "$SITE_PID" 2>/dev/null || true
          trap - EXIT
          rm -rf "$TMP"

  deny:
    name: Dependency policy (advisories, licenses, sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: ./Cargo.toml
          log-level: warn
