      - name: Download B archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: angara-release-b
          path: artifacts/b
      - name: Normalize runner install directories
        run: |
          echo "before:"
          stat -c '%a %U:%G %n' /usr/local/bin /usr/local/sbin
          # Some hosted runner images ship /usr/local/bin as 0777.  The
          # installer correctly refuses that layout; normalize the disposable
          # runner instead of weakening the managed-directory check.
          sudo chmod 0755 /usr/local/bin /usr/local/sbin
          echo "after:"
          stat -c '%a %U:%G %n' /usr/local/bin /usr/local/sbin
      - name: Install B archive
        run: |
          set -euo pipefail
          ARCHIVE=$(ls artifacts/b/*.tar.gz)
          SHA=$(awk '{print $1}' artifacts/b/SHA256SUMS)
          printf '%s  %s\n' "$SHA" "$ARCHIVE" | sha256sum -c - >/dev/null
          mkdir -p extracted
          tar -xzf "$ARCHIVE" -C extracted --no-same-owner --same-permissions
          TOP=$(find extracted -mindepth 1 -maxdepth 1 -type d -name 'angara-*' -print -quit)
          sudo "$TOP/install.sh" --archive "$PWD/$ARCHIVE" --sha256 "$SHA" \
            --expected-source-sha "$(git rev-parse HEAD)"
          echo "M08_BIN=/usr/local/bin/angara" >>"$GITHUB_ENV"
