          fetch-depth: 0
          persist-credentials: false

      - name: Build B archive
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          packaging/build-release.sh \
            --source-sha "$HEAD_SHA" \
            --packager-sha "$HEAD_SHA" \
            --output-dir target/release-artifacts/b

      - name: Build A archive from accepted M07
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          BASE=911266e20f07494226f6d67a7c93f00e22a0958d
          git worktree add --detach ../angara-a-base "$BASE"
          packaging/build-release.sh \
            --source-dir ../angara-a-base \
            --source-sha "$BASE" \
            --packager-sha "$HEAD_SHA" \
            --output-dir target/release-artifacts/a

      - name: Show archive hashes
        run: |
