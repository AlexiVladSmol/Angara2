[package]
name = "angara"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Angara proxy — HTTP/1.1 forward proxy, strict config, ACL, DNS and egress transport"
repository = "https://github.com/AlexeiSmol/Angara"

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "rand"] }
base64 = "0.22"
bytes = "1"
http = "1.5"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
idna = "1.1"
ipnet = "2.12"
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_path_to_error = "0.1"
socket2 = "0.6"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }
unicode-normalization = "0.1"
x509-parser = "0.18"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
# Angara-limited patch: preserve the original HTTP/1 request-target in a
# typed Request extension before http::Uri normalization. The vendored crate
# is hyper 1.12.0; see vendor/hyper-1.12.0/ANGARA_PATCH.md for the exact diff.
hyper = { path = "vendor/hyper-1.12.0" }
