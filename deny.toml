# Angara dependency policy (M01).
#
# - All dependencies come from crates.io or are part of this workspace.
# - Licenses are checked against an explicit permissive allow-list. The Angara
#   crate itself is unpublished (`publish = false`) and its own license is
#   deferred, so only workspace-private crates are ignored by the license check.
# - Advisories are checked against the RustSec database; ignored advisories must
#   be listed here with a reason, never silently skipped.
# - Wildcard version requirements are rejected.

[graph]
targets = []

[advisories]
ignore = [
    # chrono is used only for RFC 3339 UTC arithmetic/formatting and local
    # display. RUSTSEC-2026-0543 is an unmaintained-crate advisory, not a
    # vulnerability, and no safe replacement version exists. A migration to
    # `time`/`jiff` is a separate dependency decision.
    { id = "RUSTSEC-2026-0543", reason = "chrono is used for RFC 3339 timestamps only; unmaintained advisory, no vulnerability; migration is a separate decision" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# Only unpublished workspace crates (publish = false) are exempt from the
# project-license decision; every external dependency is still checked.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
